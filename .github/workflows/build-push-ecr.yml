name: Build, Push and Deploy to ECS DEV

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/production-ready-ecs

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: edutech-lms-frontend
  ECS_CLUSTER: edutech-lms-dev-cluster
  ECS_SERVICE: edutech-lms-dev-service
  ECS_CONTAINER_NAME: lms-frontend
  APP_URL: http://edutech-lms-dev-alb-1858179440.us-east-1.elb.amazonaws.com/

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to DEV
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::927678863298:role/edutech-lms-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # 3. Authenticate to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image using immutable Git SHA
      - name: Build Docker image
        working-directory: ./app
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_URI" .

      # 5. Push Docker image to ECR
      - name: Push Docker image
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI"

      # 6. Retrieve the task definition currently assigned to ECS
      - name: Download current ECS task definition
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ -z "$TASK_DEFINITION_ARN" || "$TASK_DEFINITION_ARN" == "None" ]]; then
            echo "ERROR: ECS service task definition not found."
            exit 1
          fi

          echo "Current task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json \
            > task-definition.json

      # 7. Replace only the container image
      - name: Render new ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 8. Register new task definition and deploy
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      # 9. Verify rollout completion and deployed image
      - name: Verify deployed image and rollout
        env:
          EXPECTED_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Waiting for ECS deployment to complete..."

          DEPLOYMENT_COMPLETED=false

          for attempt in {1..40}; do
            SERVICE_JSON=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --output json)

            ROLLOUT_STATE=$(echo "$SERVICE_JSON" | jq -r \
              '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState')

            TASK_DEFINITION_ARN=$(echo "$SERVICE_JSON" | jq -r \
              '.services[0].taskDefinition')

            DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION_ARN" \
              --output json | jq -r \
              --arg NAME "$ECS_CONTAINER_NAME" \
              '.taskDefinition.containerDefinitions[] | select(.name == $NAME) | .image')

            echo "Attempt $attempt/40"
            echo "Rollout state: $ROLLOUT_STATE"
            echo "Task definition: $TASK_DEFINITION_ARN"
            echo "Deployed image: $DEPLOYED_IMAGE"

            # Detect an unintended rollback
            if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
              echo "ERROR: Deployed image does not match this GitHub commit."
              echo "Possible ECS rollback or unexpected deployment."
              exit 1
            fi

            if [[ "$ROLLOUT_STATE" == "FAILED" ]]; then
              echo "ERROR: ECS deployment failed."
              exit 1
            fi

            if [[ "$ROLLOUT_STATE" == "COMPLETED" ]]; then
              echo "ECS rollout completed successfully."
              DEPLOYMENT_COMPLETED=true
              break
            fi

            if [[ "$attempt" -eq 40 ]]; then
              echo "ERROR: Timed out waiting for ECS deployment."
              exit 1
            fi

            sleep 15
          done

          if [[ "$DEPLOYMENT_COMPLETED" != "true" ]]; then
            echo "ERROR: ECS deployment did not complete."
            exit 1
          fi

          # Final service verification
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json)

          RUNNING_COUNT=$(echo "$SERVICE_JSON" | jq -r \
            '.services[0].runningCount')

          DESIRED_COUNT=$(echo "$SERVICE_JSON" | jq -r \
            '.services[0].desiredCount')

          PENDING_COUNT=$(echo "$SERVICE_JSON" | jq -r \
            '.services[0].pendingCount')

          echo "Running tasks: $RUNNING_COUNT"
          echo "Desired tasks: $DESIRED_COUNT"
          echo "Pending tasks: $PENDING_COUNT"

          if [[ "$RUNNING_COUNT" != "$DESIRED_COUNT" ]]; then
            echo "ERROR: Running task count does not match desired count."
            exit 1
          fi

          if [[ "$PENDING_COUNT" != "0" ]]; then
            echo "ERROR: ECS still has pending tasks."
            exit 1
          fi

          echo "======================================"
          echo "ECS DEV DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Image: $EXPECTED_IMAGE"
          echo "Task definition: $TASK_DEFINITION_ARN"
          echo "Running tasks: $RUNNING_COUNT"
          echo "Rollout: COMPLETED"

      # 10. Verify application availability through the ALB
      - name: HTTP smoke test
        run: |
          set -euo pipefail

          echo "Testing application: $APP_URL"

          for attempt in {1..12}; do
            HTTP_STATUS=$(curl -sS -L \
              --connect-timeout 5 \
              --max-time 10 \
              -o /dev/null \
              -w "%{http_code}" \
              "$APP_URL") || HTTP_STATUS="000"

            echo "Attempt $attempt/12: HTTP $HTTP_STATUS"

            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo "Application smoke test PASSED."
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "ERROR: Application smoke test FAILED."
              exit 1
            fi

            sleep 10
          done